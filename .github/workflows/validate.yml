name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: skills CLI discovers the skill
        run: |
          npx --yes skills add . --list | grep -q flow-video-recorder
      - name: frontmatter name matches
        run: |
          grep -q '^name: flow-video-recorder$' SKILL.md
      - name: versions agree
        run: |
          v="$(sed -n 's/^  version: "\(.*\)"/\1/p' SKILL.md)"
          test -n "$v"
          grep -q "\"version\": \"$v\"" .claude-plugin/plugin.json
          grep -q "\"version\": \"$v\"" .claude-plugin/marketplace.json
          grep -q "\"version\": \"$v\"" .cursor-plugin/plugin.json
          grep -q "^## $v " CHANGELOG.md
      - name: JSON manifests parse
        run: |
          for f in .claude-plugin/*.json .cursor-plugin/*.json assets/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # A static build from GitHub instead of apt: the Ubuntu mirrors have
      # taken 10 to 25 minutes for this step, the download takes seconds.
      - name: install ffmpeg
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | sudo tar -xJ -C /usr/local/bin --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          ffmpeg -version | head -1
      - name: record a flow end to end
        run: bash tests/smoke.sh
